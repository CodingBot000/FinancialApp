openapi: 3.1.0
info:
  title: Wealth Sandbox Platform API
  version: 1.0.0
  description: Canonical contract consumed by the mobile application.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Current platform API origin
paths:
  /api/v1/health:
    get:
      operationId: getPlatformHealth
      summary: Read platform API health
      security: []
      tags:
        - Health
      responses:
        '200':
          description: Platform API is ready to accept local requests.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/health/ready:
    get:
      operationId: getPlatformReadiness
      summary: Probe platform database readiness
      security: []
      tags: [Health]
      responses:
        '200':
          description: Platform dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: At least one required dependency is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/health/metrics:
    get:
      operationId: getPlatformMetrics
      summary: Read bounded local platform metrics
      description: Private monitoring ingress only; never expose through the public demo proxy.
      security: []
      tags: [Health]
      responses:
        '200':
          description: In-process counters and database pool gauges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Resolve the verified OIDC subject to the current application user
      description: Requires the `financial.read` scope.
      security:
        - BearerAuth: []
      tags:
        - Identity
      responses:
        '200':
          description: Current synthetic application user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Bearer token is missing, expired, or cannot be verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Bearer token does not include `financial.read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/mydata/connections:
    post:
      operationId: createMyDataConnection
      summary: Create the single synthetic institution connection
      description: Requires `financial.write`; the external customer identifier is never returned.
      security:
        - BearerAuth: []
      tags: [MyData]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionRequest'
      responses:
        '201':
          description: Synthetic institution connection created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An active connection already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      operationId: listMyDataConnections
      summary: List the current user's institution connections
      description: Requires `financial.read`.
      security:
        - BearerAuth: []
      tags: [MyData]
      responses:
        '200':
          description: Zero or one connection in MVP.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/mydata/syncs:
    post:
      operationId: createMyDataSync
      summary: Queue a manual synthetic institution synchronization
      description: Requires `financial.write`. An already-active sync is returned with HTTP 200.
      security:
        - BearerAuth: []
      tags: [MyData]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSyncRequest'
      responses:
        '200':
          description: Existing active sync.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sync'
        '202':
          description: New sync queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sync'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/mydata/syncs/{syncId}:
    get:
      operationId: getMyDataSync
      summary: Read a user-owned sync status
      description: Requires `financial.read` and ownership.
      security:
        - BearerAuth: []
      tags: [MyData]
      parameters:
        - name: syncId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current sync status and normalized counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sync'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/assets/summary:
    get:
      operationId: getAssetSummary
      summary: Read the server-authoritative asset summary
      description: Requires `financial.read`.
      security:
        - BearerAuth: []
      tags: [Wealth]
      responses:
        '200':
          description: Latest asset snapshot and allocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: List user-owned normalized accounts
      description: Requires `financial.read`; only masked account identifiers are returned.
      security:
        - BearerAuth: []
      tags: [Wealth]
      responses:
        '200':
          description: Account page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/accounts/{accountId}:
    get:
      operationId: getAccount
      summary: Read one user-owned account
      description: Requires `financial.read`; non-owned resources return 404.
      security:
        - BearerAuth: []
      tags: [Wealth]
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/holdings:
    get:
      operationId: listHoldings
      summary: List user-owned normalized holdings
      description: Requires `financial.read` and applies ownership to an optional account filter.
      security:
        - BearerAuth: []
      tags: [Wealth]
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Holding page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/transactions:
    get:
      operationId: listTransactions
      summary: List user-owned normalized transactions
      description: Requires `financial.read`.
      security:
        - BearerAuth: []
      tags: [Wealth]
      responses:
        '200':
          description: Transaction page ordered by occurrence time descending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/assets/history:
    get:
      operationId: getAssetHistory
      summary: Read unique daily asset snapshot points in ascending order
      description: Requires `financial.read`.
      security:
        - BearerAuth: []
      tags: [Wealth]
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [1M, 3M, 1Y, ALL]
            default: 1Y
      responses:
        '200':
          description: Asset history points.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetHistory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/simulations:
    post:
      operationId: createSimulation
      summary: Run and persist a deterministic synthetic financial simulation
      description: Requires `simulation.execute`. The server generates and stores the seed.
      security:
        - BearerAuth: []
      tags: [Simulation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSimulationRequest'
      responses:
        '201':
          description: Completed and persisted synthetic simulation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/simulations/{simulationId}:
    get:
      operationId: getSimulation
      summary: Read one persisted user-owned simulation
      description: Requires `simulation.execute`; non-owned resources return 404.
      security:
        - BearerAuth: []
      tags: [Simulation]
      parameters:
        - name: simulationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Persisted simulation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orders/preview:
    post:
      operationId: previewBuyOrder
      summary: Create an immutable synthetic BUY quote
      description: Requires `order.execute`; non-owned account/instrument combinations return 404.
      security:
        - BearerAuth: []
      tags: [Trading]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        '201':
          description: Synthetic quote valid for 60 seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Synthetic market circuit is temporarily open.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/orders:
    get:
      operationId: listOrders
      summary: List current user's BUY orders
      description: Requires `financial.read`; cursor is the last order ID from the prior page.
      security:
        - BearerAuth: []
      tags: [Trading]
      parameters:
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Owner-scoped order page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: prepareBuyOrder
      summary: Idempotently create a BUY order and reserve cash
      description: Requires `order.execute`. Cash reservation commits before one non-retried external POST.
      security:
        - BearerAuth: []
      tags: [Trading]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: Existing result for the same key and canonical payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '201':
          description: New order reached FILLED or REJECTED deterministically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '202':
          description: External result is UNKNOWN and reconciliation is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency conflict, expired quote, or insufficient funds.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get one owner-scoped order
      description: Requires `financial.read`.
      security:
        - BearerAuth: []
      tags: [Trading]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current persisted order state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/dev/scenario:
    put:
      operationId: setDeveloperScenario
      summary: Set the local/demo simulator scenario
      description: Local is relaxed; demo requires `scenario.admin`. The module is absent in production.
      security:
        - {}
        - BearerAuth: []
      tags: [Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDeveloperScenarioRequest'
      responses:
        '200':
          description: Applied global simulator scenario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperScenarioResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/dev/dataset/reset:
    post:
      operationId: resetDeveloperDataset
      summary: Reset the local/demo synthetic simulator dataset
      description: Local is relaxed; demo requires `scenario.admin`. The module is absent in production.
      security:
        - {}
        - BearerAuth: []
      tags: [Developer]
      responses:
        '200':
          description: Deterministic synthetic baseline restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperResetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Request identifier accepted from the caller or generated by the API.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CorrelationId:
      description: Identifier propagated across platform and simulator calls.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    TooManyRequests:
      description: The caller exceeded the configured request rate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Bearer token is missing, expired, or cannot be verified.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Bearer token does not include the required scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationFailed:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource does not exist or is not owned by the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    CreateConnectionRequest:
      type: object
      additionalProperties: false
      required: [institutionCode, consentExpiresAt]
      properties:
        institutionCode:
          type: string
          const: SYNTH_WEALTH_001
        consentExpiresAt:
          type: string
          format: date-time
    Connection:
      type: object
      additionalProperties: false
      required:
        - connectionId
        - institutionCode
        - status
        - consentExpiresAt
        - lastSuccessfulSyncAt
      properties:
        connectionId:
          type: string
          format: uuid
        institutionCode:
          type: string
          const: SYNTH_WEALTH_001
        status:
          type: string
          enum: [ACTIVE, REVOKED, EXPIRED]
        consentExpiresAt:
          type: string
          format: date-time
        lastSuccessfulSyncAt:
          type: [string, 'null']
          format: date-time
    CreateSyncRequest:
      type: object
      additionalProperties: false
      required: [connectionId]
      properties:
        connectionId:
          type: string
          format: uuid
    Sync:
      type: object
      additionalProperties: false
      required:
        - syncId
        - connectionId
        - status
        - createdAt
        - startedAt
        - completedAt
        - counts
        - errorCode
      properties:
        syncId:
          type: string
          format: uuid
        connectionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, FETCHING, RAW_STORED, NORMALIZING, COMPLETED, FAILED]
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        counts:
          $ref: '#/components/schemas/SyncCounts'
        errorCode:
          type: [string, 'null']
    SyncCounts:
      type: object
      additionalProperties: false
      required: [rawRecords, accounts, holdings, transactions]
      properties:
        rawRecords:
          type: integer
          minimum: 0
        accounts:
          type: integer
          minimum: 0
        holdings:
          type: integer
          minimum: 0
        transactions:
          type: integer
          minimum: 0
    Money:
      type: string
      pattern: '^-?[0-9]+\.[0-9]{4}$'
    AssetSummary:
      type: object
      additionalProperties: false
      required:
        - asOfDate
        - currency
        - totalAssets
        - cash
        - investments
        - change
        - allocation
        - lastSyncedAt
      properties:
        asOfDate:
          type: string
          format: date
        currency:
          type: string
          const: KRW
        totalAssets:
          $ref: '#/components/schemas/Money'
        cash:
          $ref: '#/components/schemas/Money'
        investments:
          $ref: '#/components/schemas/Money'
        change:
          type: object
          additionalProperties: false
          required: [amount, rate]
          properties:
            amount:
              $ref: '#/components/schemas/Money'
            rate:
              type: number
        allocation:
          type: array
          items:
            $ref: '#/components/schemas/Allocation'
        lastSyncedAt:
          type: [string, 'null']
          format: date-time
    Allocation:
      type: object
      additionalProperties: false
      required: [assetClass, amount, weight]
      properties:
        assetClass:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        weight:
          type: number
          minimum: 0
          maximum: 1
    Account:
      type: object
      additionalProperties: false
      required:
        - accountId
        - institutionCode
        - maskedAccountNumber
        - accountType
        - currency
        - status
        - cashBalance
      properties:
        accountId:
          type: string
          format: uuid
        institutionCode:
          type: string
        maskedAccountNumber:
          type: string
        accountType:
          type: string
        currency:
          type: string
        status:
          type: string
        cashBalance:
          $ref: '#/components/schemas/Money'
    AccountPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        nextCursor:
          type: 'null'
    Holding:
      type: object
      additionalProperties: false
      required:
        - holdingId
        - accountId
        - instrumentId
        - instrumentCode
        - displayName
        - assetClass
        - quantity
        - averagePrice
        - marketValue
        - asOfAt
      properties:
        holdingId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        instrumentId:
          type: string
          format: uuid
        instrumentCode:
          type: string
        displayName:
          type: string
        assetClass:
          type: string
        quantity:
          type: string
        averagePrice:
          $ref: '#/components/schemas/Money'
        marketValue:
          $ref: '#/components/schemas/Money'
        asOfAt:
          type: string
          format: date-time
    HoldingPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Holding'
        nextCursor:
          type: 'null'
    Transaction:
      type: object
      additionalProperties: false
      required:
        - transactionId
        - accountId
        - transactionType
        - amount
        - currency
        - occurredAt
      properties:
        transactionId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        transactionType:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        occurredAt:
          type: string
          format: date-time
    TransactionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        nextCursor:
          type: 'null'
    AssetHistory:
      type: object
      additionalProperties: false
      required: [points]
      properties:
        points:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [date, totalAssets, cash, investments]
            properties:
              date:
                type: string
                format: date
              totalAssets:
                $ref: '#/components/schemas/Money'
              cash:
                $ref: '#/components/schemas/Money'
              investments:
                $ref: '#/components/schemas/Money'
    CreateSimulationRequest:
      type: object
      additionalProperties: false
      required:
        - initialAssets
        - monthlyContribution
        - durationMonths
        - targetAmount
        - allocation
      properties:
        initialAssets:
          $ref: '#/components/schemas/NonNegativeMoneyInput'
        monthlyContribution:
          $ref: '#/components/schemas/NonNegativeMoneyInput'
        durationMonths:
          type: integer
          minimum: 1
          maximum: 600
        targetAmount:
          $ref: '#/components/schemas/NonNegativeMoneyInput'
        allocation:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [assetClass, weight]
            properties:
              assetClass:
                type: string
                enum: [CASH, BOND, EQUITY]
              weight:
                type: number
                minimum: 0
                maximum: 1
    NonNegativeMoneyInput:
      type: string
      pattern: '^[0-9]+(?:\.[0-9]{1,4})?$'
    Simulation:
      type: object
      additionalProperties: false
      required:
        - simulationId
        - engineVersion
        - assumptionSetVersion
        - currency
        - goalProbability
        - finalValue
        - series
        - disclaimer
      properties:
        simulationId:
          type: string
          format: uuid
        engineVersion:
          type: string
          const: 1.0.0
        assumptionSetVersion:
          type: string
          const: SYNTHETIC_V1
        currency:
          type: string
          const: KRW
        goalProbability:
          type: number
          minimum: 0
          maximum: 1
        finalValue:
          $ref: '#/components/schemas/SimulationPercentiles'
        series:
          type: array
          minItems: 2
          maxItems: 601
          items:
            $ref: '#/components/schemas/SimulationPoint'
        disclaimer:
          type: string
          const: Synthetic financial simulation for technical demonstration only.
    SimulationPercentiles:
      type: object
      additionalProperties: false
      required: [p10, p50, p90]
      properties:
        p10:
          $ref: '#/components/schemas/Money'
        p50:
          $ref: '#/components/schemas/Money'
        p90:
          $ref: '#/components/schemas/Money'
    SimulationPoint:
      type: object
      additionalProperties: false
      required: [month, p10, p50, p90]
      properties:
        month:
          type: integer
          minimum: 0
          maximum: 600
        p10:
          $ref: '#/components/schemas/Money'
        p50:
          $ref: '#/components/schemas/Money'
        p90:
          $ref: '#/components/schemas/Money'
    CreateQuoteRequest:
      type: object
      additionalProperties: false
      required: [accountId, instrumentId, side, quantity]
      properties:
        accountId:
          type: string
          format: uuid
        instrumentId:
          type: string
          format: uuid
        side:
          type: string
          const: BUY
        quantity:
          type: string
          pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{1,8})?$'
    Quote:
      type: object
      additionalProperties: false
      required:
        - quoteId
        - side
        - quantity
        - unitPrice
        - estimatedAmount
        - fee
        - currency
        - expiresAt
        - syntheticQuote
      properties:
        quoteId:
          type: string
          format: uuid
        side:
          type: string
          const: BUY
        quantity:
          type: string
          pattern: '^[0-9]+\.[0-9]{8}$'
        unitPrice:
          $ref: '#/components/schemas/Money'
        estimatedAmount:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          const: KRW
        expiresAt:
          type: string
          format: date-time
        syntheticQuote:
          type: boolean
          const: true
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [quoteId, accountId, instrumentId, side, quantity]
      properties:
        quoteId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        instrumentId:
          type: string
          format: uuid
        side:
          type: string
          const: BUY
        quantity:
          type: string
          pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{1,8})?$'
    Order:
      type: object
      additionalProperties: false
      required:
        - orderId
        - status
        - side
        - quantity
        - estimatedAmount
        - filledAmount
        - createdAt
        - updatedAt
        - statusRefreshRecommendedAfterMs
      properties:
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING_SUBMISSION, UNKNOWN, FILLED, REJECTED, FAILED]
        side:
          type: string
          const: BUY
        quantity:
          type: string
          pattern: '^[0-9]+\.[0-9]{8}$'
        estimatedAmount:
          $ref: '#/components/schemas/Money'
        filledAmount:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{4}$'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        statusRefreshRecommendedAfterMs:
          type: [integer, 'null']
          enum: [2000, null]
    OrderPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        nextCursor:
          type: [string, 'null']
          format: uuid
    DeveloperScenarioMode:
      type: string
      enum:
        [
          NORMAL,
          TIMEOUT,
          HTTP_500,
          MALFORMED_RESPONSE,
          ORDER_REJECT,
          ORDER_UNKNOWN_THEN_FILLED,
        ]
    SetDeveloperScenarioRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/DeveloperScenarioMode'
        correlationScope:
          type: string
          const: CURRENT_USER
    DeveloperScenarioResponse:
      type: object
      additionalProperties: false
      required: [mode, scope]
      properties:
        mode:
          $ref: '#/components/schemas/DeveloperScenarioMode'
        scope:
          type: string
          const: GLOBAL
    DeveloperResetResponse:
      type: object
      additionalProperties: false
      required: [datasetVersion, scenarioMode, syntheticData]
      properties:
        datasetVersion: { type: string, minLength: 1 }
        scenarioMode: { type: string, const: NORMAL }
        syntheticData: { type: boolean, const: true }
    MeResponse:
      type: object
      additionalProperties: false
      required:
        - userId
        - displayName
        - riskProfile
        - datasetVersion
        - syntheticData
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
        riskProfile:
          type: string
          enum:
            - CONSERVATIVE
            - BALANCED
            - GROWTH
        datasetVersion:
          type: string
          minLength: 1
        syntheticData:
          type: boolean
          const: true
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
        - traceId
        - retryable
        - fieldErrors
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        traceId:
          type: string
        retryable:
          type: boolean
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - code
              - message
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - datasetVersion
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: platform-api
        datasetVersion:
          type: string
          minLength: 1
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service, datasetVersion, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service:
          type: string
          const: platform-api
        datasetVersion:
          type: string
          minLength: 1
        checks:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              type: string
              enum: [up, down]
    MetricsResponse:
      type: object
      additionalProperties: false
      required: [service, datasetVersion, uptimeSeconds, databasePool, counters]
      properties:
        service:
          type: string
          const: platform-api
        datasetVersion:
          type: string
          minLength: 1
        uptimeSeconds:
          type: integer
          minimum: 0
        databasePool:
          type: object
          additionalProperties: false
          required: [total, idle, waiting]
          properties:
            total: { type: integer, minimum: 0 }
            idle: { type: integer, minimum: 0 }
            waiting: { type: integer, minimum: 0 }
        counters:
          type: object
          additionalProperties: false
          required:
            - httpRequestsTotal
            - httpResponses5xxTotal
            - externalRequestFailuresTotal
            - circuitRejectedTotal
            - circuitOpenedTotal
          properties:
            httpRequestsTotal: { type: integer, minimum: 0 }
            httpResponses5xxTotal: { type: integer, minimum: 0 }
            externalRequestFailuresTotal: { type: integer, minimum: 0 }
            circuitRejectedTotal: { type: integer, minimum: 0 }
            circuitOpenedTotal: { type: integer, minimum: 0 }
