openapi: 3.1.0
info:
  title: Wealth Sandbox Platform API
  version: 1.0.0
  description: Canonical contract consumed by the mobile application.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Current platform API origin
paths:
  /api/v1/health:
    get:
      operationId: getPlatformHealth
      summary: Read platform API health
      security: []
      tags:
        - Health
      responses:
        '200':
          description: Platform API is ready to accept local requests.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          description: Too many health requests.
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Resolve the verified OIDC subject to the current application user
      description: Requires the `financial.read` scope.
      security:
        - BearerAuth: []
      tags:
        - Identity
      responses:
        '200':
          description: Current synthetic application user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Bearer token is missing, expired, or cannot be verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Bearer token does not include `financial.read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Request identifier accepted from the caller or generated by the API.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CorrelationId:
      description: Identifier propagated across platform and simulator calls.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    MeResponse:
      type: object
      additionalProperties: false
      required:
        - userId
        - displayName
        - riskProfile
        - datasetVersion
        - syntheticData
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
        riskProfile:
          type: string
          enum:
            - CONSERVATIVE
            - BALANCED
            - GROWTH
        datasetVersion:
          type: string
          minLength: 1
        syntheticData:
          type: boolean
          const: true
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
        - traceId
        - retryable
        - fieldErrors
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        traceId:
          type: string
        retryable:
          type: boolean
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - code
              - message
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - datasetVersion
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: platform-api
        datasetVersion:
          type: string
          minLength: 1
